version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /adapters/go
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /adapters/java
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      node-sdk:
        patterns: ['@opentelemetry/*']
  - package-ecosystem: npm
    directory: /ci/markdownlint
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
