name: Traffic Badge

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-badge
  cancel-in-progress: false

jobs:
  update:
    name: Update traffic badge
    runs-on: ubuntu-latest
    if: github.repository == 'quuxio/otelc' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Publish traffic data as quuxio
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { printf 'TRAFFIC_TOKEN is required.\n' >&2; exit 1; }
          python3 ci/update_traffic_badge.py
