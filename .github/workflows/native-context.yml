name: Native owned context
on:
  pull_request:
    paths:
      - 'adapters/native/**'
      - 'native/llvm/**'
      - 'ci/check_native_controls.py'
      - 'tests/test_native_controls_coverage.py'
      - '.github/workflows/native-context.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  context:
    name: Owned native context and SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install matched native tools
        run: |
          if [[ '${{ matrix.os }}' == ubuntu-24.04 ]]; then
            bash ci/install_llvm22.sh
            printf 'CC=/usr/lib/llvm-22/bin/clang\nCXX=/usr/lib/llvm-22/bin/clang++\nOTELC_LLVM_BIN=/usr/lib/llvm-22/bin\n' >> "$GITHUB_ENV"
          else
            brew install llvm@22 cmake ninja
            printf 'CC=/opt/homebrew/opt/llvm@22/bin/clang\nCXX=/opt/homebrew/opt/llvm@22/bin/clang++\nOTELC_LLVM_BIN=/opt/homebrew/opt/llvm@22/bin\n' >> "$GITHUB_ENV"
          fi
      - name: Install locked Python checks
        run: |
          mkdir -p build/native-context
          git rev-parse HEAD > build/native-context/head.txt
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 8 * 1024**3, "at least 8 GiB required"'
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt -r requirements.txt
      - name: Reproduce final-reference deadlock against the frozen runtime
        run: |
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 8 * 1024**3, "at least 8 GiB required"'
          before_root="$GITHUB_WORKSPACE/build/native-context-before/source"
          mkdir -p "$before_root"
          git archive --format=tar --output build/native-context/before-source.tar 98b3cfedd685170cfa71e71b2a7e6f10ad40c416
          tar -xf build/native-context/before-source.tar -C "$before_root"
          git show e0e0991d66723608ec2775cebb4cf2b28eb133a4:adapters/native/tests/function_runtime_test.cpp > build/native-context/before-regression.cpp
          cp build/native-context/before-regression.cpp "$before_root/adapters/native/tests/function_runtime_test.cpp"
          set +e
          (cd "$before_root" && OTELC_CPP_ANALYSIS=1 PYTHONDONTWRITEBYTECODE=1 "$GITHUB_WORKSPACE/.venv/bin/python" -m ci.check_native_controls) 2>&1 | tee build/native-context/before-tests.log
          before_exit=${PIPESTATUS[0]}
          set -e
          OTELC_BEFORE_EXIT="$before_exit" .venv/bin/python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          output = Path('build/native-context')
          root = Path('build/native-context-before/source')
          assert int(os.environ['OTELC_BEFORE_EXIT']) == 1
          assert hashlib.sha256((output / 'before-source.tar').read_bytes()).hexdigest() == '91a88cd3db02ef579bcf0a367316331d86525e7a6dbd55519e08bc93c9f09fc8'
          text = (output / 'before-tests.log').read_text()
          assert re.search(r'\bnative_function_runtime\s+\(Timeout\)', text)
          logs = list((root / 'build').glob('native-controls-*/Testing/Temporary/LastTest.log'))
          assert len(logs) == 1
          ctest = logs[0].read_text()
          assert ctest.count('Test Passed.') == 2
          assert ctest.count('native owned context: final-reference deleter entered') == 1
          assert 'native owned context: 6 SDK groups passed' not in ctest
          (output / 'before-ctest.log').write_bytes(logs[0].read_bytes())
          database = logs[0].parents[2] / 'compile_commands.json'
          (output / 'before-compile-commands.json').write_bytes(database.read_bytes())
          test = output / 'before-regression.cpp'
          assert (root / 'adapters/native/tests/function_runtime_test.cpp').read_bytes() == test.read_bytes()
          (output / 'before-result.json').write_text(json.dumps({
              'runtime_head': '98b3cfedd685170cfa71e71b2a7e6f10ad40c416',
              'regression_test_head': 'e0e0991d66723608ec2775cebb4cf2b28eb133a4',
              'native_runtime_sha256': hashlib.sha256((root / 'adapters/native/src/function_runtime.cpp').read_bytes()).hexdigest(),
              'regression_test_sha256': hashlib.sha256(test.read_bytes()).hexdigest(),
              'exit_code': 1, 'ctest_passed': 2,
              'expected_failure': 'native_function_runtime Timeout after the actual final-reference deleter entered',
              'scope': 'Old runtime with the maintained new regression test only; not a passing SDK/provider qualification.'}, indent=2) + '\n')
          PY
      - name: Run actual SDK and compiler-linked checks with per-component floors
        run: |
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 8 * 1024**3, "at least 8 GiB required"'
          make native-check PYTHON=.venv/bin/python 2>&1 | tee build/native-context/tests.log
          .venv/bin/python -c 'from pathlib import Path; assert Path("build/native-sdk-tests.log").read_text().count("native owned context: 6 SDK groups passed") == 1'
          .venv/bin/python -c 'from pathlib import Path; assert Path("build/native-sdk-tests.log").read_text().count("native owned context: mixed address/named SDK groups passed") == 1'
          .venv/bin/python -m coverage json --data-file=build/native-tooling.coverage -o build/native-context/python-coverage.json
      - name: Retain exact source
        if: always()
        run: |
          mkdir -p build/native-context
          git archive --format=tar --output build/native-context/source.tar HEAD
          git status --porcelain --untracked-files=no > build/native-context/source-status.txt
          test ! -s build/native-context/source-status.txt
      - name: Retain compact SDK records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-context-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/native-context/
            build/native-control-coverage.json
            build/native-control.lcov
            build/native-sdk-compile-commands.json
            build/native-sdk-tests.log
            build/native-control-test
            build/native-function-test
            build/native-object-test
            build/native-control.profdata
            build/native-object-pass-coverage.json
            build/native-object-pass.lcov
            build/native-object-pass-compile-commands.json
            build/native-object-plugin.*
