name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Documentation and tooling
    runs-on: ubuntu-24.04
    env:
      CC: /usr/lib/llvm-22/bin/clang
      CXX: /usr/lib/llvm-22/bin/clang++
      OTELC_LLVM_BIN: /usr/lib/llvm-22/bin
      OTELC_NATIVE_BENCHMARK_CAPTURE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache-dependency-path: adapters/go/go.sum
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native observer tools
        run: bash ci/install_llvm22.sh
      - run: make setup check PYTHON=.venv/bin/python
      - name: Retain native benchmark failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-benchmark-linux-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/native-benchmark-diagnostics/
            build/native-benchmark-tests-*/*-otlp/otlp-*
            build/native-benchmark-tests-*/**/failed-flush.json
            build/native-benchmark-tests-*/**/agent.log
            build/native-benchmark-tests-*/**/health.json
            build/native-benchmark-tests-*/**/stderr.log
            build/native-benchmark-tests-*/**/responses.jsonl
            build/native-benchmark-tests-*/**/raw.jsonl
            build/native-benchmark-tests-*/**/report.json
            build/native-benchmark-tests-*/**/metric-finalization.json
            build/native-benchmark-tests-*/**/native-execution.json
            build/native-benchmark-tests-*/**/native-benchmark-execution.json
            build/native-benchmark-tests-*/**/compiled/plain
            build/native-benchmark-tests-*/**/compiled/instrumented
            build/native-benchmark-tests-*/sdk/native-sdk-build.json
            build/native-benchmark-tests-*/sdk/libotelc_native_runtime.so
            build/native-benchmark-tests-*/sdk/libotelc_native_runtime.dylib
      - run: docker compose config --quiet
  macos:
    # Keep the existing protected check identifier; this job runs each delivered adapter.
    name: Native macOS ARM64 and 80% coverage
    runs-on: macos-26
    env:
      CC: /opt/homebrew/opt/llvm@22/bin/clang
      CXX: /opt/homebrew/opt/llvm@22/bin/clang++
      OTELC_LLVM_BIN: /opt/homebrew/opt/llvm@22/bin
      OTELC_NATIVE_BENCHMARK_CAPTURE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache-dependency-path: adapters/go/go.sum
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native observer tools
        run: brew install llvm@22 cmake ninja protobuf curl
      - run: make setup check PYTHON=.venv/bin/python
      - name: Retain native benchmark failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-benchmark-macos-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/native-benchmark-diagnostics/
            build/native-benchmark-tests-*/*-otlp/otlp-*
            build/native-benchmark-tests-*/**/failed-flush.json
            build/native-benchmark-tests-*/**/agent.log
            build/native-benchmark-tests-*/**/health.json
            build/native-benchmark-tests-*/**/stderr.log
            build/native-benchmark-tests-*/**/responses.jsonl
            build/native-benchmark-tests-*/**/raw.jsonl
            build/native-benchmark-tests-*/**/report.json
            build/native-benchmark-tests-*/**/metric-finalization.json
            build/native-benchmark-tests-*/**/native-execution.json
            build/native-benchmark-tests-*/**/native-benchmark-execution.json
            build/native-benchmark-tests-*/**/compiled/plain
            build/native-benchmark-tests-*/**/compiled/instrumented
            build/native-benchmark-tests-*/sdk/native-sdk-build.json
            build/native-benchmark-tests-*/sdk/libotelc_native_runtime.so
            build/native-benchmark-tests-*/sdk/libotelc_native_runtime.dylib
  sonar:
    name: SonarQube
    needs: [quality, macos]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      CC: /usr/lib/llvm-22/bin/clang
      CXX: /usr/lib/llvm-22/bin/clang++
      OTELC_LLVM_BIN: /usr/lib/llvm-22/bin
      OTELC_CPP_ANALYSIS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache-dependency-path: adapters/go/go.sum
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native observer tools
        run: bash ci/install_llvm22.sh
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt -r requirements.txt
          npm ci --ignore-scripts --no-audit
          make java-check node-check go-check test sonar-policy
          mvn -q -f adapters/java/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:copy-dependencies -DincludeScope=test -DoutputDirectory=target/dependency
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Identify commit
        id: commit
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectVersion=${{ steps.commit.outputs.sha }}
            -Dsonar.qualitygate.wait=true
