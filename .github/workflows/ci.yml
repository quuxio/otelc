name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ['.badges/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Documentation and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install validation tools
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          python3 -m pip install --require-hashes --only-binary=:all: -r adapters/python/requirements.txt
          npm ci --ignore-scripts --prefix ci/markdownlint
      - name: Validate documents and tooling
        run: make lint test PYTHON=python3

  native:
    name: Native macOS ARM64 and 80% coverage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python adapter and coverage dependencies
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          python3 -m pip install --require-hashes --only-binary=:all: -r adapters/python/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install Node adapter dependencies
        run: npm ci --ignore-scripts --prefix adapters/node
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build Java adapter
        run: make java-build
      - name: Install Rust and matching coverage tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default 1.98.1
          brew install llvm@22
          cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Validate native runtime and coverage
        run: make rust-check model-check rust-coverage python-check node-check java-check PYTHON=python3

  sonar:
    name: SonarQube
    needs: [quality, native]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install coverage tooling
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          python3 -m pip install --require-hashes --only-binary=:all: -r adapters/python/requirements.txt
      - name: Produce coverage report
        run: make test PYTHON=python3
      - name: Verify remote new-code policy
        run: make sonar-policy PYTHON=python3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Identify the analyzed commit
        id: commit
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Scan and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectVersion=${{ steps.commit.outputs.sha }}
            -Dsonar.qualitygate.wait=true
