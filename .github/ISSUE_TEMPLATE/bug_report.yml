name: Bug report
description: Report a reproducible problem with implemented behaviour.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: Remove credentials and private information before submitting. The runtime is not implemented yet; use a design proposal for architecture feedback.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the commit, minimal commands, and relevant toolchain/platform details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
