# One unchanged policy for every equivalent language example.
schema_version = 3
languages = ["java", "typescript", "javascript", "python", "go", "c", "cpp", "rust"]

[resource]
service_name = "otelc-examples"

[export]
endpoint = "http://127.0.0.1:4320"
interval_ms = 1000
timeout_ms = 1000
shutdown_timeout_ms = 10000

[sources]
include = ["examples/**"]
exclude = ["**/generated/**"]

[functions]
include = ["*workload*"]
exclude = ["*excluded*"]

[metrics]
collection = true
emission = true
histogram_boundaries_seconds = [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0]

[traces]
enabled = true
sample_ratio = 0.01

[lifetimes]
enabled = true
include = ["*WorkItem", "*work_item"]
exclude = []
release_methods = ["close"]
max_live = 1000000

[benchmark]
iterations = 10000
warmup = 5
samples = 15
