schema_version = 2
languages = ["rust"]

[adapters.rust]
backend = "llvm"

[sources]
include = ["examples/apps/rust_compiler_expanded.rs"]

[functions]
include = ["*.generated", "*.generic"]

[traces]
enabled = true
root_sample_ratio = 1.0

[resource]
service_name = "otelc-rust-compiler-expanded"

[export]
endpoint = "http://127.0.0.1:4318"
