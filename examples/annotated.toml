schema_version = 2
languages = ["c", "cpp"]

[sources]
include = ["examples/apps/**"]
exclude = []

[functions]
include = ["configured_order*", "audit_order*", "conflicted_order*"]
exclude = ["blocked_order*"]

[annotations]
read_existing = true
inject_generated = false

[export]
endpoint = "http://127.0.0.1:4318"
interval_ms = 1000

[resource]
service_name = "otelc-annotated-example"

[adapters.c]
backend = "llvm"
[adapters.cpp]
backend = "llvm"
