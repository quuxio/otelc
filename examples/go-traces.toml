schema_version = 2
languages = ["go"]
[sources]
include = ["examples/apps/go_*.go"]
[functions]
include = ["examples.apps.go_app.*", "examples.apps.go_annotated.configured"]
exclude = ["*.main", "*.excluded", "*.<anonymous>:*"]
[annotations]
read_existing = true
[traces]
enabled = true
root_sample_ratio = 1.0
max_active_traces = 32
max_spans_per_trace = 256
[resource]
service_name = "otelc-go-traces"
[export]
endpoint = "http://127.0.0.1:4318"
interval_ms = 500
[adapters.go]
backend = "compile"
