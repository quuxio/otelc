schema_version = 2
languages = ["javascript"]

[sources]
include = ["examples/apps/javascript_collection*.cjs"]

[functions]
include = ["*.make"]
exclude = ["*.constructor", "*.compute"]

[annotations]
read_existing = true

[lifetimes]
enabled = true
boundary = "collection"
include = ["*.WorkItem"]

[traces]
enabled = true
root_sample_ratio = 1.0

[resource]
service_name = "otelc-javascript-collection"

[export]
endpoint = "http://127.0.0.1:4318"
interval_ms = 1000
timeout_ms = 1000
