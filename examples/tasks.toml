# Shared task-only policy; no language-specific tool settings.
schema_version = 3

[resource]
service_name = "otelc-task-examples"

[export]
endpoint = "http://127.0.0.1:4320"

[sources]
include = ["examples/**"]

[functions]
include = ["*workload*", "*parent*", "*child*"]

[traces]
enabled = true
sample_ratio = 1.0

[context]
tasks = true
http = false
