# One policy for the ordinary Java, JavaScript, TypeScript, Python and Go HTTP apps.
schema_version = 3

[resource]
service_name = "otelc-http-examples"

[export]
endpoint = "http://127.0.0.1:4320"
interval_ms = 1000

[sources]
include = ["examples/**", "**/*.go"]
exclude = []

[functions]
include = ["*.workloadRequest", "*.workloadHandle", "*.workloadChild", "HttpContextApp.request(*)", "HttpContextApp.handle(*)"]

[context]
http = true
tasks = false

[metrics]
collection = false
emission = false

[traces]
enabled = true
sample_ratio = 1.0

[lifetimes]
enabled = false
