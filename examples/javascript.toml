schema_version = 2
languages = ["javascript"]

[sources]
include = ["examples/apps/javascript*.*"]

[functions]
include = ["examples.apps.javascript_app.*", "examples.apps.javascript_annotated.configured"]
exclude = ["*.excluded", "*.main"]

[annotations]
read_existing = true

[resource]
service_name = "otelc-javascript-example"

[export]
endpoint = "http://127.0.0.1:4318"
interval_ms = 100
timeout_ms = 300

[adapters.javascript]
backend = "loader"
