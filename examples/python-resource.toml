schema_version = 2
languages = ["python"]

[resource]
service_name = "otelc-python-resource"

[sources]
include = ["examples/apps/python_resource_app.py"]

[functions]
include = ["examples.apps.python_resource_app.create"]

[lifetimes]
enabled = true
boundary = "resource"
include = ["examples.apps.python_resource_app.Resource"]

[[lifetimes.resources]]
type_name = "examples.apps.python_resource_app.Resource"
release = "close"
completion = "normal_return"

[traces]
enabled = true
root_sample_ratio = 1.0

[runtime]
max_live_lifetimes = 16

[export]
max_queued_batches = 8
