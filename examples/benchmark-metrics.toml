# One common metrics-only comparison policy, including languages without lifetimes.
schema_version = 3
languages = ["java", "typescript", "javascript", "python", "go", "c", "cpp", "rust"]

[resource]
service_name = "otelc-examples"

[export]
endpoint = "http://127.0.0.1:4320"
interval_ms = 1000
timeout_ms = 1000
shutdown_timeout_ms = 10000

[sources]
include = ["examples/**", "**/*.go"]
exclude = ["**/generated/**"]

[functions]
include = ["*workload*"]
exclude = ["*excluded*"]

[metrics]
collection = true
emission = true

[traces]
enabled = true
sample_ratio = 0.01

[lifetimes]
enabled = false

[benchmark]
iterations = 10000
warmup = 5
samples = 15
